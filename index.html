<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>รายรับ-รายจ่าย | Modern</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg1: #0b0f1a;
      --bg2: #111827;
      --glass: rgba(255, 255, 255, 0.05);
      --glass-border: rgba(255, 255, 255, 0.08);
      --text: #f8fafc;
      --muted: #94a3b8;
      --income: #34d399;
      --income-glow: rgba(52, 211, 153, 0.35);
      --expense: #f472b6;
      --expense-glow: rgba(244, 114, 182, 0.35);
      --primary: #60a5fa;
      --primary-glow: rgba(96, 165, 250, 0.4);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Inter', system-ui, sans-serif;
      background: linear-gradient(145deg, var(--bg1), #0f172a 40%, #1e1b4b);
      color: var(--text);
      min-height: 100vh;
      padding: 24px 16px 40px;
      line-height: 1.5;
    }

    .container {
      max-width: 460px;
      margin: 0 auto;
    }

    h1 {
      text-align: center;
      font-size: 1.7rem;
      font-weight: 700;
      margin-bottom: 28px;
      letter-spacing: -0.5px;
      background: linear-gradient(90deg, #e0f2fe, #c4b5fd);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    /* ===== Summary Cards ===== */
    .summary {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 12px;
      margin-bottom: 28px;
    }

    .card {
      background: var(--glass);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--glass-border);
      border-radius: 18px;
      padding: 16px 10px;
      text-align: center;
      transition: transform 0.25s ease, box-shadow 0.25s ease;
    }

    .card:hover {
      transform: translateY(-3px);
    }

    .card .label {
      font-size: 0.72rem;
      color: var(--muted);
      margin-bottom: 6px;
      font-weight: 500;
      letter-spacing: 0.3px;
    }

    .card .amount {
      font-size: 1.05rem;
      font-weight: 700;
    }

    .income .amount {
      color: var(--income);
      text-shadow: 0 0 18px var(--income-glow);
    }

    .expense .amount {
      color: var(--expense);
      text-shadow: 0 0 18px var(--expense-glow);
    }

    .balance .amount {
      color: var(--primary);
      text-shadow: 0 0 18px var(--primary-glow);
    }

    /* ===== Form Card ===== */
    .form-card {
      background: var(--glass);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid var(--glass-border);
      border-radius: 22px;
      padding: 22px 20px;
      margin-bottom: 28px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.25);
    }

    .type-toggle {
      display: flex;
      gap: 10px;
      margin-bottom: 18px;
    }

    .type-btn {
      flex: 1;
      padding: 12px;
      border-radius: 14px;
      border: 1px solid var(--glass-border);
      background: rgba(255, 255, 255, 0.03);
      color: var(--muted);
      font-size: 0.95rem;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.25s ease;
    }

    .type-btn.active-income {
      background: rgba(52, 211, 153, 0.15);
      border-color: rgba(52, 211, 153, 0.4);
      color: var(--income);
      box-shadow: 0 0 20px var(--income-glow);
    }

    .type-btn.active-expense {
      background: rgba(244, 114, 182, 0.15);
      border-color: rgba(244, 114, 182, 0.4);
      color: var(--expense);
      box-shadow: 0 0 20px var(--expense-glow);
    }

    .form-row {
      margin-bottom: 16px;
    }

    label {
      display: block;
      font-size: 0.8rem;
      color: var(--muted);
      margin-bottom: 7px;
      font-weight: 500;
    }

    input, select {
      width: 100%;
      padding: 13px 15px;
      border-radius: 14px;
      border: 1px solid var(--glass-border);
      background: rgba(0, 0, 0, 0.25);
      color: var(--text);
      font-size: 0.98rem;
      outline: none;
      transition: border-color 0.25s, box-shadow 0.25s;
    }

    input:focus, select:focus {
      border-color: rgba(96, 165, 250, 0.6);
      box-shadow: 0 0 0 3px rgba(96, 165, 250, 0.15);
    }

    button[type="submit"] {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 14px;
      background: linear-gradient(135deg, #3b82f6, #8b5cf6);
      color: white;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      margin-top: 6px;
      transition: all 0.25s ease;
      box-shadow: 0 4px 20px rgba(99, 102, 241, 0.35);
    }

    button[type="submit"]:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 28px rgba(99, 102, 241, 0.5);
    }

    button[type="submit"]:active {
      transform: translateY(0);
    }

    /* ===== List ===== */
    .list-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 14px;
    }

    .list-header h2 {
      font-size: 1.1rem;
      font-weight: 600;
    }

    .clear-btn {
      background: transparent;
      border: none;
      color: var(--muted);
      font-size: 0.82rem;
      cursor: pointer;
      transition: color 0.2s;
    }

    .clear-btn:hover {
      color: var(--expense);
    }

    .transactions {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .item {
      background: var(--glass);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid var(--glass-border);
      border-radius: 16px;
      padding: 14px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      transition: all 0.25s ease;
    }

    .item:hover {
      background: rgba(255, 255, 255, 0.07);
      transform: translateX(3px);
    }

    .item-left {
      display: flex;
      flex-direction: column;
      gap: 3px;
    }

    .item-title {
      font-weight: 500;
      font-size: 0.95rem;
    }

    .item-meta {
      font-size: 0.75rem;
      color: var(--muted);
    }

    .item-right {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .item-amount {
      font-weight: 600;
      font-size: 0.95rem;
    }

    .item-amount.income {
      color: var(--income);
      text-shadow: 0 0 12px var(--income-glow);
    }

    .item-amount.expense {
      color: var(--expense);
      text-shadow: 0 0 12px var(--expense-glow);
    }

    .delete-btn {
      background: rgba(255, 255, 255, 0.05);
      border: none;
      color: var(--muted);
      width: 28px;
      height: 28px;
      border-radius: 50%;
      font-size: 1.1rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s;
    }

    .delete-btn:hover {
      background: rgba(244, 114, 182, 0.2);
      color: var(--expense);
    }

    .empty {
      text-align: center;
      color: var(--muted);
      padding: 48px 0;
      font-size: 0.95rem;
      background: var(--glass);
      border-radius: 18px;
      border: 1px dashed var(--glass-border);
    }

    @media (max-width: 420px) {
      .summary {
        grid-template-columns: 1fr;
      }
      
      .card {
        padding: 14px;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>รายรับ · รายจ่าย</h1>

    <!-- Summary -->
    <div class="summary">
      <div class="card income">
        <div class="label">รายรับ</div>
        <div class="amount" id="total-income">฿0</div>
      </div>
      <div class="card expense">
        <div class="label">รายจ่าย</div>
        <div class="amount" id="total-expense">฿0</div>
      </div>
      <div class="card balance">
        <div class="label">คงเหลือ</div>
        <div class="amount" id="balance">฿0</div>
      </div>
    </div>

    <!-- Form -->
    <div class="form-card">
      <form id="transaction-form">
        <div class="type-toggle">
          <button type="button" class="type-btn active-income" data-type="income">รายรับ</button>
          <button type="button" class="type-btn" data-type="expense">รายจ่าย</button>
        </div>

        <div class="form-row">
          <label for="description">รายละเอียด</label>
          <input type="text" id="description" placeholder="เช่น เงินเดือน, ค่าอาหาร" required />
        </div>

        <div class="form-row">
          <label for="amount">จำนวนเงิน (บาท)</label>
          <input type="number" id="amount" placeholder="0" min="0" step="0.01" required />
        </div>

        <div class="form-row">
          <label for="category">หมวดหมู่</label>
          <select id="category">
            <option value="ทั่วไป">ทั่วไป</option>
            <option value="อาหาร">อาหาร</option>
            <option value="เดินทาง">เดินทาง</option>
            <option value="ที่พัก">ที่พัก</option>
            <option value="บันเทิง">บันเทิง</option>
            <option value="สุขภาพ">สุขภาพ</option>
            <option value="เงินเดือน">เงินเดือน</option>
            <option value="โบนัส">โบนัส</option>
            <option value="อื่น ๆ">อื่น ๆ</option>
          </select>
        </div>

        <button type="submit">เพิ่มรายการ</button>
      </form>
    </div>

    <!-- List -->
    <div class="list-header">
      <h2>รายการล่าสุด</h2>
      <button class="clear-btn" id="clear-all">ล้างทั้งหมด</button>
    </div>
    <div class="transactions" id="transaction-list">
      <div class="empty">ยังไม่มีรายการ</div>
    </div>
  </div>

  <script>
    let transactions = JSON.parse(localStorage.getItem('transactions')) || [];
    let currentType = 'income';

    const form = document.getElementById('transaction-form');
    const listEl = document.getElementById('transaction-list');
    const totalIncomeEl = document.getElementById('total-income');
    const totalExpenseEl = document.getElementById('total-expense');
    const balanceEl = document.getElementById('balance');
    const typeBtns = document.querySelectorAll('.type-btn');
    const clearBtn = document.getElementById('clear-all');

    typeBtns.forEach(btn => {
      btn.addEventListener('click', () => {
        typeBtns.forEach(b => b.classList.remove('active-income', 'active-expense'));
        currentType = btn.dataset.type;
        btn.classList.add(currentType === 'income' ? 'active-income' : 'active-expense');
      });
    });

    function formatMoney(num) {
      return '฿' + Number(num).toLocaleString('th-TH', {
        minimumFractionDigits: 0,
        maximumFractionDigits: 2
      });
    }

    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }

    function formatDate(iso) {
      return new Date(iso).toLocaleDateString('th-TH', {
        day: 'numeric',
        month: 'short',
        year: 'numeric'
      });
    }

    function save() {
      localStorage.setItem('transactions', JSON.stringify(transactions));
    }

    function render() {
      const income = transactions
        .filter(t => t.type === 'income')
        .reduce((sum, t) => sum + t.amount, 0);
      const expense = transactions
        .filter(t => t.type === 'expense')
        .reduce((sum, t) => sum + t.amount, 0);

      totalIncomeEl.textContent = formatMoney(income);
      totalExpenseEl.textContent = formatMoney(expense);
      balanceEl.textContent = formatMoney(income - expense);

      if (transactions.length === 0) {
        listEl.innerHTML = '<div class="empty">ยังไม่มีรายการ</div>';
        return;
      }

      listEl.innerHTML = transactions
        .slice()
        .reverse()
        .map(t => `
          <div class="item">
            <div class="item-left">
              <div class="item-title">${escapeHtml(t.description)}</div>
              <div class="item-meta">${t.category} · ${formatDate(t.date)}</div>
            </div>
            <div class="item-right">
              <div class="item-amount ${t.type}">
                ${t.type === 'income' ? '+' : '-'}${formatMoney(t.amount)}
              </div>
              <button class="delete-btn" data-id="${t.id}" title="ลบ">×</button>
            </div>
          </div>
        `).join('');

      document.querySelectorAll('.delete-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          transactions = transactions.filter(t => t.id !== Number(btn.dataset.id));
          save();
          render();
        });
      });
    }

    form.addEventListener('submit', e => {
      e.preventDefault();
      const description = document.getElementById('description').value.trim();
      const amount = parseFloat(document.getElementById('amount').value);
      const category = document.getElementById('category').value;

      if (!description || isNaN(amount) || amount <= 0) return;

      transactions.push({
        id: Date.now(),
        type: currentType,
        description,
        amount,
        category,
        date: new Date().toISOString()
      });

      save();
      render();
      form.reset();
      document.getElementById('description').focus();
    });

    clearBtn.addEventListener('click', () => {
      if (transactions.length === 0) return;
      if (confirm('ต้องการลบรายการทั้งหมดใช่ไหม?')) {
        transactions = [];
        save();
        render();
      }
    });

    render();
  </script>
</body>
</html>
